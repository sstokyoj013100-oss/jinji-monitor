name: Jinji Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '5 22 * * *' # 日本時間の毎日午前09:05に実行

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    # actions/cache/restore を v5 に更新（Node.js 24対応）
    - name: Restore detection history cache
      id: history-cache
      uses: actions/cache/restore@v5
      with:
        path: detection_history.json
        key: jinji-history-v3-${{ github.run_id }}
        restore-keys: |
          jinji-history-v3-

    - name: Install dependencies
      run: pip install requests beautifulsoup4 pdfplumber

    # プログラムの実行 (スクリプト名: main.py)
    - name: Run logic
      env:
        PYTHONUNBUFFERED: "1"
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: python main.py

    # 万が一、プログラムからファイルが生成されなかった場合の保険処理
    - name: Ensure history file exists
      if: always()
      run: |
        if [ ! -f "detection_history.json" ]; then
          echo '{"hits": [], "warnings": []}' > detection_history.json
          echo "警告: detection_history.json が見つからなかったため、空のファイルを生成しました。"
        fi

    # actions/cache/save を v5 に更新（Node.js 24対応）
    - name: Save detection history cache
      if: always()
      uses: actions/cache/save@v5
      with:
        path: detection_history.json
        key: jinji-history-v3-${{ github.run_id }}
